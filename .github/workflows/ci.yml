name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # GitHub-hosted runner on purpose: this repo is public, and pull requests
    # from forks must not run code on the org's self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # tsc + oxlint + oxfmt --check + check-repo + bun test
      - run: bun run check
