# /etc/nginx/sites-available/defense.eternum.lat  (TLS block added by certbot / the house setup)
# /etc/nginx/snippets/mydefense-active.conf is written by deploy/mydefense.sh and sets $mydefense_port.
# The app serves the SPA and the API itself, so everything is proxied to the active slot.
server {
    listen 443 ssl;
    server_name defense.eternum.lat;
    # ssl_certificate / ssl_certificate_key: as in the other eternum.lat vhosts.

    include snippets/mydefense-active.conf;

    # Materials up to 10 MiB (MATERIAL_MAX_BYTES) plus the multipart envelope.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:$mydefense_port;
        # Required: every GraphQL write is rejected when Origin does not match Host (ARCHITECTURE.md).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grading with thinking at `high` can take a while.
        proxy_read_timeout 120s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
